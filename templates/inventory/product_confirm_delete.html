{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h4>
            </div>
            <div class="card-body text-center p-5">
                <h3>Are you sure?</h3>
                <p class="lead">You are about to delete <strong>{{ product.name }}</strong>.</p>
                <p class="text-muted">This action cannot be undone.</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="{% url 'product_list' %}" class="btn btn-secondary btn-lg">Cancel</a>
                        <button type="submit" class="btn btn-danger btn-lg">Yes, Delete it</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

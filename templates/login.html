<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Smart Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0a0e1a;
            color: #e8eaf6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated abstract background */
        .bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-canvas::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(79,142,247,0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 70%, rgba(139,92,246,0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 10%, rgba(0,212,255,0.06) 0%, transparent 30%),
                radial-gradient(ellipse at 10% 80%, rgba(16,185,129,0.06) 0%, transparent 30%);
            animation: bgShift 15s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(2%, 2%) rotate(1deg); }
        }

        /* Grid pattern */
        .bg-canvas::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(79,142,247,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,142,247,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }

        .orb-1 {
            width: 300px; height: 300px;
            background: #4f8ef7;
            top: 10%; left: 5%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 200px; height: 200px;
            background: #8b5cf6;
            bottom: 15%; right: 8%;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 150px; height: 150px;
            background: #00d4ff;
            top: 60%; left: 30%;
            animation-delay: -6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* LOGIN CARD */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(79,142,247,0.2);
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 25px 50px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255,255,255,0.05) inset;
            animation: cardIn 0.6s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-top {
            padding: 36px 36px 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .card-top::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4f8ef7, #00d4ff, #8b5cf6);
        }

        .brand-orb {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            color: white;
            margin: 0 auto 18px;
            box-shadow: 0 8px 30px rgba(79,142,247,0.4);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 30px rgba(79,142,247,0.4); }
            50% { box-shadow: 0 8px 40px rgba(79,142,247,0.7); }
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: #e8eaf6;
            letter-spacing: 0.3px;
        }

        .brand-sub {
            font-size: 12px;
            color: #8892a4;
            font-family: 'JetBrains Mono', monospace;
            margin-top: 4px;
        }

        .card-body-inner {
            padding: 28px 36px 36px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 600;
            color: #8892a4;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a5568;
            font-size: 14px;
            transition: color 0.2s;
            z-index: 2;
        }

        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #e8eaf6;
            padding: 12px 14px 12px 40px;
            font-size: 14px;
            font-family: 'Space Grotesk', sans-serif;
            width: 100%;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            background: rgba(79,142,247,0.08);
            border-color: rgba(79,142,247,0.5);
            box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
            color: #e8eaf6;
        }

        .form-control:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: #4f8ef7;
        }

        .form-control::placeholder { color: #2d3748; }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4f8ef7, #3b6fd4);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(79,142,247,0.35);
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79,142,247,0.55);
            background: linear-gradient(135deg, #5a9af9, #4f8ef7);
        }

        .btn-login:active { transform: translateY(0); }

        .alert-danger {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .card-footer-inner {
            text-align: center;
            padding: 14px 36px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            color: #4a5568;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg-canvas"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Login Card -->
<div class="login-container">
    <div class="login-card">
        <div class="card-top">
            <div class="brand-orb">
                <i class="fas fa-boxes-stacked"></i>
            </div>
            <div class="brand-name">Smart Inventory</div>
            <div class="brand-sub">Inventory Management System v1.0</div>
        </div>

        <div class="card-body-inner">
            {% if form.errors %}
            <div class="alert-danger">
                <i class="fas fa-exclamation-circle me-2"></i>Invalid username or password
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <label class="form-label">Username</label>
                <div class="input-wrapper">
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    <i class="fas fa-user input-icon"></i>
                </div>

                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    <i class="fas fa-lock input-icon"></i>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-arrow-right me-2"></i>Sign In
                </button>
            </form>
        </div>

        <div class="card-footer-inner">
            © 2026 Smart Inventory · All rights reserved
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
